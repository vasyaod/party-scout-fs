name: validate data

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'tools/pre_commit_validate.py'
      - 'tools/test_pre_commit_validate.py'
      - 'tools/install_hooks.py'
      - 'hooks/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'tools/pre_commit_validate.py'
      - 'tools/test_pre_commit_validate.py'
      - 'tools/install_hooks.py'
      - 'hooks/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check the checker first: a validator whose checks stopped firing
      # would report clean data no matter what is in data/.
      - name: Self-test the validator
        run: python3 scripts/test_validate_data.py

      # The local gate (tools/pre_commit_validate.py, issue #11) is the half of
      # this that runs before a push exists. It can be bypassed and it is absent
      # in a clone that never installed it, so CI stays the absolute bar — but a
      # gate that quietly stopped refusing bad commits would look like nothing
      # at all, so its own self-test runs here.
      #
      # It runs even when the step above failed: that one reads the real data/,
      # so a data problem (#10 today) would otherwise skip this and hide whether
      # the gate still fires. The gate's own cases are synthetic and independent.
      - name: Self-test the pre-commit gate
        if: ${{ !cancelled() }}
        run: python3 tools/test_pre_commit_validate.py

      # --ref: a check's count may not go above the commit this builds on,
      # even where the committed baseline would still allow it (issue #20 —
      # once the data improves, the baseline's leftover headroom would hide a
      # regression back up to the old count). No parent (first push of a
      # branch, workflow_dispatch): the baseline alone.
      - name: Validate data/ against MODEL.md
        env:
          PARENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$PARENT" ] || [ "$PARENT" = "0000000000000000000000000000000000000000" ]; then
            python3 scripts/validate_data.py
          else
            git fetch --no-tags --depth=1 origin "$PARENT"
            python3 scripts/validate_data.py --ref "$PARENT"
          fi
